groups:
  - name: trading_alerts
    interval: 30s
    rules:
      # ── Circuit breaker tripped ──────────────────────────────────────────────
      # Fires when the circuit-breaker counter shows a new trip event.
      # The metric risk_checks_triggered_total is incremented with
      # check_name="drawdown" or check_name="daily_loss" and action="HALT_TRADING"
      # whenever the breaker trips.
      - alert: CircuitBreakerTripped
        expr: |
          increase(trading_risk_checks_triggered_total{action="HALT_TRADING"}[5m]) > 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "Circuit breaker tripped — all live trading halted"
          description: >
            A risk check with action HALT_TRADING was triggered in the last 5 minutes.
            check_name={{ $labels.check_name }}.
            Immediate manual review required before resuming live trading.

      # ── Daily loss limit approaching or breached ─────────────────────────────
      # Fires when the daily P&L gauge shows a loss exceeding 15 % of starting
      # equity (75 % of the 20 % Phase-1 hard limit = warning threshold).
      - alert: DailyLossLimit
        expr: |
          (
            trading_daily_pnl_gbp
            / on() group_left()
            trading_portfolio_equity_gbp
          ) < -0.15
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Daily loss approaching the hard limit"
          description: >
            Daily P&L has dropped below -15 % of current equity
            (value={{ $value | humanizePercentage }}).
            Hard limit is -20 %. Reduce position sizes immediately.

      # ── Data feed down ───────────────────────────────────────────────────────
      # Fires when no data-feed latency samples have been recorded for 5 minutes,
      # indicating the market-data WebSocket has stalled or disconnected.
      - alert: DataFeedDown
        expr: |
          increase(trading_data_feed_latency_ms_count[5m]) == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Market data feed has stopped receiving candles"
          description: >
            No data-feed latency observations recorded for feed={{ $labels.feed }}
            symbol={{ $labels.symbol }} in the last 5 minutes.
            The WebSocket connection may have dropped.

      # ── Broker API errors elevated ───────────────────────────────────────────
      # Fires when the broker API error rate exceeds 5 errors per minute,
      # suggesting connectivity issues or authentication failure.
      - alert: BrokerAPIErrors
        expr: |
          rate(trading_broker_api_errors_total[5m]) * 60 > 5
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Elevated broker API error rate"
          description: >
            Broker API errors for broker={{ $labels.broker }}
            error_type={{ $labels.error_type }} are occurring at a rate of
            {{ $value | humanize }} per minute (threshold: 5/min).
            Check broker connectivity and API credentials.

      # ── High slippage detected ───────────────────────────────────────────────
      # Fires when the 95th-percentile order execution latency exceeds 500 ms,
      # which correlates with poor fills and elevated slippage in volatile markets.
      - alert: HighSlippage
        expr: |
          histogram_quantile(
            0.95,
            rate(trading_order_execution_latency_ms_bucket[10m])
          ) > 500
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High order execution latency — possible slippage"
          description: >
            The 95th-percentile order execution latency for
            broker={{ $labels.broker }} order_type={{ $labels.order_type }}
            has exceeded 500 ms (current p95={{ $value | humanize }} ms).
            This may indicate elevated slippage. Consider reducing order frequency
            or switching to limit orders.
