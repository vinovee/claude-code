global:
  resolve_timeout: 5m

route:
  group_by: ["alertname", "severity"]
  group_wait: 10s
  group_interval: 5m
  repeat_interval: 4h
  receiver: "telegram"
  routes:
    - match:
        severity: critical
      receiver: "telegram"
      repeat_interval: 30m

receivers:
  - name: "telegram"
    webhook_configs:
      - url: "http://host.docker.internal:8001/alerts/webhook"
        send_resolved: true
